<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <title>Spanish Quiz by Serhii</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Telegram WebApp JS -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  
<style> body {
  background: linear-gradient(to right, #fa709a 0%, #fee140 100%);
}
</style>

  <style>
    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #e5e7eb;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      align-items: center;
      justify-content: center;
      padding: 16px;
      text-align: center;
    }

    .card {
      background: rgba(62, 58, 40, 0.897);
      border-radius: 16px;
      padding: 20px;
      max-width: 400px;
      width: 100%;
      box-shadow: 0 20px 30px rgba(235, 213, 17, 0.663);
    }

    h1 {
      font-size: 22px;
      margin-bottom: 12px;
    }

    .word {
      font-size: 26px;
      margin: 12px 0 20px;
      font-weight: 700;
      color: #d5c68a;
    }

    .options {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 16px;
    }

    button.option {
      padding: 10px 14px;
      border-radius: 999px;
      border: none;
      font-size: 16px;
      cursor: pointer;
      background: #1e293b;
      color: #e5e7eb;
    }

    button.option.correct {
      background: #22c55e;
      color: #022c22;
    }

    button.option.wrong {
      background: #ef4444;
      color: #450a0a;
    }

    .result {
      min-height: 24px;
      margin-bottom: 8px;
      font-size: 15px;
    }

    .send-btn {
      margin-top: 4px;
      padding: 10px 14px;
      border-radius: 999px;
      border: none;
      cursor: pointer;
      background: #38bdf8;
      color: #0f172a;
      font-weight: 600;
      font-size: 15px;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1 id="quizTitle">Мініквіз 🇪🇸</h1>
    <div id="levelBadge" style="font-size: 14px; margin-bottom: 8px;">
      Level A1
    </div>
    <div id="questionPrompt">Обери правильний переклад слова:</div>

    <div class="word" id="wordText">...</div>

    <div id="exampleText" style="font-size: 14px; margin-bottom: 16px;"></div>

    <div class="options" id="optionsContainer">
      <!-- Кнопки варіантів JS намалює сам -->
    </div>

    <div class="result" id="result"></div>
    <div id="hint" style="font-size: 13px; color: #cbd5f5; margin-bottom: 6px;">
      Обирай відповіді. Натисни «Завершити», щоб надіслати підсумок боту.
    </div>
    <div id="error" style="font-size: 13px; color: #fecaca; min-height: 16px;"></div>

    <button class="send-btn" id="nextBtn" style="margin-top: 8px; background: #22c55e; color: #022c22;">
      Наступне слово 🔁
    </button>

    <button class="send-btn" id="finishBtn" style="margin-top: 8px; background: #62a6ee; color: #111521;">
      Завершити й надіслати підсумок 🏆
    </button>
  </div>

<script src="locales.js"></script>
<script>
  const tg = window.Telegram?.WebApp || {
    expand: () => {},
    close: () => {}
  };
  tg.expand();

  const params = new URLSearchParams(window.location.search);
  let level = params.get("level") || "A1";

  const allowedLevels = ["A1", "A2", "B1"];
  if (!allowedLevels.includes(level)) {
    level = "A1";
  }

  const requestedLanguage = params.get("lang");
  const lang = ["uk", "en"].includes(requestedLanguage) ? requestedLanguage : "uk";
  const dictionary = window.QuizLocales[lang];
  function t(key, values = {}) {
    if (typeof dictionary[key] !== "string") throw new Error("Missing localization: " + key);
    return dictionary[key].replace(/\{(\w+)\}/g, (_, name) => values[name]);
  }
  document.documentElement.lang = lang;
  document.title = t("title");
  document.getElementById("quizTitle").textContent = t("heading");
  document.getElementById("questionPrompt").textContent = t("prompt");
  const levelBadge = document.getElementById("levelBadge");
  const wordText = document.getElementById("wordText");
  const optionsContainer = document.getElementById("optionsContainer");
  const resultEl = document.getElementById("result");
  const hintEl = document.getElementById("hint");
  const errorEl = document.getElementById("error");
  const nextBtn = document.getElementById("nextBtn");
  const finishBtn = document.getElementById("finishBtn");

  levelBadge.textContent = t("level", {level});
  nextBtn.textContent = t("next");
  finishBtn.textContent = t("finish");
  hintEl.textContent = t("hint");

  let words = [];
  let currentWord = null;
  let answered = false;
  let submitting = false;
  const answers = [];
  finishBtn.disabled = true;
  nextBtn.disabled = true;

  function sessionPayload(items = answers) {
    return JSON.stringify({level, lang, answers: items});
  }

  async function loadWords() {
    try {
      const response = await fetch("data/" + level + ".json");
      if (!response.ok) {
        throw new Error("HTTP " + response.status);
      }
      words = await response.json();

      if (!Array.isArray(words) || words.length === 0) throw new Error("Empty vocabulary");
      for (const word of words) {
        const options = word.options?.[lang];
        const normalize = value => value.normalize("NFKC").trim().toLowerCase();
        if (typeof word.id !== "string" || !word.id || typeof word.es !== "string" || !word.es.trim()
            || typeof word[lang] !== "string" || !word[lang].trim()
            || !Array.isArray(options) || options.length !== 4
            || options.some(o => typeof o !== "string" || !o.trim())
            || (word.example && ["es", "uk", "en"].some(k => typeof word.example[k] !== "string" || !word.example[k].trim()))
            || new Set(options.map(normalize)).size !== options.length
            || options.filter(o => normalize(o) === normalize(word[lang])).length !== 1) {
          throw new Error("Invalid question options");
        }
      }

      pickRandomWord();
      renderQuestion();
    } catch (err) {
      console.error(err);
      errorEl.textContent = t("loadError", {level});
      wordText.textContent = t("loadWordError");
    }
  }

  function pickRandomWord() {
    const index = Math.floor(Math.random() * words.length);
    currentWord = words[index];
  }

  function shuffle(array) {
    const arr = array.slice();
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  }

  function renderQuestion() {
    if (!currentWord) return;
    answered = false;
    nextBtn.disabled = true;

    wordText.textContent = currentWord.es;
    const example = currentWord.example;
    document.getElementById("exampleText").textContent = example
      ? t("context", {example: example.es}) + (currentWord.region === "ES" ? " · " + t("region_ES") : "")
      : "";
    resultEl.textContent = "";
    errorEl.textContent = "";
    hintEl.textContent = t("hint");

    optionsContainer.innerHTML = "";

    const optionsShuffled = shuffle(
      currentWord.options[lang]
    );

    optionsShuffled.forEach(optionText => {
      const btn = document.createElement("button");
      btn.className = "option";
      btn.textContent = optionText;

      btn.addEventListener("click", () => {
        if (answered || submitting) return;
        const answer = {id: currentWord.id, chosen: optionText};
        const candidate = [...answers, answer];
        // Telegram sendData permits at most 4096 bytes. Keep a safety margin.
        if (candidate.length > 20 || new TextEncoder().encode(sessionPayload(candidate)).length > 3500) {
          errorEl.textContent = t("full");
          nextBtn.disabled = true;
          return;
        }
        answered = true;
        answers.push(answer);
        finishBtn.disabled = false;
        nextBtn.disabled = answers.length >= 20;
        hintEl.textContent = t("count", {count: answers.length});
        const correctAnswer = currentWord[lang];
        const allButtons = optionsContainer.querySelectorAll(".option");
        allButtons.forEach(b => {
          b.classList.remove("correct", "wrong");
        });

        const correct = optionText === correctAnswer;

        if (correct) {
          btn.classList.add("correct");
          resultEl.textContent = t("correct", {word: currentWord.es, answer: correctAnswer});
        } else {
          btn.classList.add("wrong");
          resultEl.textContent = t("wrong", {answer: correctAnswer});
        }

        if (currentWord.example) {
          resultEl.textContent += " " + t("exampleTranslation", {example: currentWord.example[lang]});
        }
        allButtons.forEach(b => { b.disabled = true; });
      });

      optionsContainer.appendChild(btn);
    });
  }

  nextBtn.addEventListener("click", () => {
    if (!answered || nextBtn.disabled || submitting) return;
    pickRandomWord();
    renderQuestion();
  });

  finishBtn.addEventListener("click", () => {
    if (answers.length === 0 || submitting) return;
    if (typeof tg.sendData !== "function" || tg.platform === "unknown") {
      errorEl.textContent = t("outside");
      return;
    }
    submitting = true;
    finishBtn.disabled = true;
    try {
      // Keyboard WebApp sendData delivers the payload and closes the app.
      tg.sendData(sessionPayload());
    } catch (e) {
      submitting = false;
      finishBtn.disabled = false;
      errorEl.textContent = t("sendError");
    }
  });

  loadWords();
</script>
</body>
</html>
